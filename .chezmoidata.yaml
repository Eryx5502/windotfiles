# Machine-specific values referenced by templated dotfiles.
# Override per machine in ~/.config/chezmoi/chezmoi.toml under [data].

dev:
  root: 'D:\desarrollo'
vs:
  root: 'C:\Program Files\Microsoft Visual Studio\18\Community'

# Empty by design: real SSH targets are machine-local and must NOT live in this
# public repo. Add them in ~/.config/chezmoi/chezmoi.toml, one block each:
#
#   [[data.sshDomains]]
#       name = "dt12"
#       host = "some-host"
#       user = "someone"
#       leaderKey = "i"          # optional: LEADER+<key> attaches this domain
#       hostLabel = "some-pc"    # optional: tab bar hostname while attached
#       multiplexing = "WezTerm" # optional: emitted as the domain's multiplexing field
#       label = "Office"         # optional: picker label (defaults to name)
#
# Domains sharing a leaderKey get an InputSelector picker; a lone one attaches directly.
# With none set, wezterm's ssh_domains renders as an empty table.
sshDomains: []

# Empty by design, same reason as sshDomains. ~/.ssh/config renders these Host
# blocks, in order, ahead of the shared "Host *" block:
#
#   [[data.sshHosts]]
#       pattern = "dt12 dt12-alt"
#       options = ['User someone', "DynamicForward 1080"]
#
#   [[data.sshHosts]]
#       pattern = "dt12"
#       options = ["HostName some-host"]
sshHosts: []

# Internal git host referenced by .gitconfig's credential section. Empty here on
# purpose: set it machine-locally in ~/.config/chezmoi/chezmoi.toml:
#
#   [data.git]
#       internalHost = "git.example.com"
#
# With it empty, that credential section is omitted entirely.
#
# Identity and Git Credential Manager settings default to the work machine.
# Override any of them per machine the same way, e.g. a personal laptop:
#
#   [data.git]
#       name = "A. Balmaseda"
#       email = "me@example.com"
#       gcmProvider = ""     # empty: let GCM auto-detect (GitHub OAuth etc.)
#       useHttpPath = false
#       sshCommand = "C:/Windows/System32/OpenSSH/ssh.exe"
#
# GCM itself comes from Git for Windows' system config (credential.helper=manager).
git:
  internalHost: ''
  name: 'Aitor Balmaseda'
  email: 'abalmaseda@innomerics.com'
  gcmProvider: 'generic'
  useHttpPath: true
  sshCommand: ''

# Empty by design: real vault paths are machine-local and must NOT live in this
# public repo. Add them in ~/.config/chezmoi/chezmoi.toml, one block each:
#
#   [[data.keepassVaults]]
#       name = "personal"
#       path = 'D:\me\personal.kdbx'
#       default = true
#
#   [[data.keepassVaults]]
#       name = "shared"
#       path = 'S:\team\shared.kdbx'
#       masterFromVault = "personal"       # vault holding this one's master password
#       masterFromEntry = "Shared vault"   # entry in it whose Password field is that key
#
# Consumed by dot_config/keepass-credential/vaults.json.tmpl, which the KeePassCredential
# PowerShell module reads on first use. With none set, it renders an empty array.
keepassVaults: []
