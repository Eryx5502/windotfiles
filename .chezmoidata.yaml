# Machine-specific values referenced by templated dotfiles.
# Override per machine in ~/.config/chezmoi/chezmoi.toml under [data].

dev:
  root: 'D:\desarrollo'
vs:
  root: 'C:\Program Files\Microsoft Visual Studio\18\Community'

# Empty by design: real SSH targets are machine-local and must NOT live in this
# public repo. Add them in ~/.config/chezmoi/chezmoi.toml, one block each:
#
#   [[data.sshDomains]]
#       name = "dt12"
#       host = "some-host"
#       user = "someone"
#
# With none set, wezterm's ssh_domains renders as an empty table.
sshDomains: []

# Internal git host referenced by .gitconfig's credential section. Empty here on
# purpose: set it machine-locally in ~/.config/chezmoi/chezmoi.toml:
#
#   [data.git]
#       internalHost = "git.example.com"
#
# With it empty, that credential section is omitted entirely.
git:
  internalHost: ''
