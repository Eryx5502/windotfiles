# Packages installed by .chezmoiscripts/run_onchange_after_install-packages.ps1.tmpl
#
# HOW THIS WORKS
#   - Editing this file re-runs the installer on the next `chezmoi apply`.
#   - Already-installed packages are skipped, so re-running is cheap and safe.
#   - Delete what you never want; uncomment from the catalogue at the bottom to
#     add. Everything listed was installed on the source machine (2026-08-26).
#
# ELEVATION
#   `winget`      -> installs per-user, no admin rights needed.
#   `wingetAdmin` -> machine-scope installers (they land in C:\Program Files).
#                    When `chezmoi apply` runs unelevated these are SKIPPED and
#                    the script prints one paste-able command for an admin shell.
#                    Run `chezmoi apply` from an elevated terminal to do it all
#                    in one pass.
#   Unsure where a new package belongs? Put it under `winget`. If it needs
#   elevation the install fails harmlessly and the script tells you to move it.

packages:
  # --- No admin required ---------------------------------------------------
  winget:
    - twpayne.chezmoi # chezmoi itself
    - Starship.Starship # prompt (cached in the profile)
    - ajeetdsouza.zoxide # z
    - Schniz.fnm # node version manager (lazy-init)
    - junegunn.fzf # `s`/`n`/`wt` functions, svn helpers
    - sharkdp.fd # `wt` function
    - BurntSushi.ripgrep.MSVC # rg: svn.psm1
    - dandavison.delta # git pager + lazygit diff renderer
    - JesseDuffield.lazygit # lg
    - sxyazi.yazi # y / yz
    - lsd-rs.lsd # ls / la aliases
    - sharkdp.bat # bat
    - Anthropic.Claude # claude: `c` alias

  # --- Requires an elevated shell ------------------------------------------
  wingetAdmin:
    - Git.Git # git
    - Microsoft.PowerShell # pwsh 7 (the profile targets this, not 5.1)
    - Neovim.Neovim # nvim: `e`/`n` functions, yazi opener
    - wez.wezterm.nightly # wezterm: `e` function, ssh_domains
    - LGUG2Z.komorebi # window manager (komorebi.json managed here)
    - LGUG2Z.whkd # hotkey daemon (whkdrc managed here)
    - Slik.Subversion # svn CLI: svn.psm1 helpers
    - 7zip.7zip # machine-wide installer (Program Files), needs elevation

  psgallery:
    - PSFzf # required: Ctrl+T / Ctrl+R in the profile
    # - BurntToast
    # - Microsoft.PowerToys.Configure

